<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>http-ano</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10" id="piano-container">
                <div class="keys d-flex flex-wrap justify-content-center">

                    <!-- Octave 3 -->
                    <div class="key white" data-note="C3" data-key="1"></div>
                    <div class="key black" data-note="C#3" data-key="2"></div>
                    <div class="key white" data-note="D3" data-key="3"></div>
                    <div class="key black" data-note="D#3" data-key="4"></div>
                    <div class="key white" data-note="E3" data-key="5"></div>
                    <div class="key white" data-note="F3" data-key="6"></div>
                    <div class="key black" data-note="F#3" data-key="7"></div>
                    <div class="key white" data-note="G3" data-key="8"></div>
                    <div class="key black" data-note="G#3" data-key="9"></div>
                    <div class="key white" data-note="A3" data-key="10"></div>
                    <div class="key black" data-note="A#3" data-key="11"></div>
                    <div class="key white" data-note="B3" data-key="12"></div>

                    <!-- Octave 4 -->
                    <div class="key white" data-note="C4" data-key="13"></div>
                    <div class="key black" data-note="C#4" data-key="14"></div>
                    <div class="key white" data-note="D4" data-key="15"></div>
                    <div class="key black" data-note="D#4" data-key="16"></div>
                    <div class="key white" data-note="E4" data-key="17"></div>
                    <div class="key white" data-note="F4" data-key="18"></div>
                    <div class="key black" data-note="F#4" data-key="19"></div>
                    <div class="key white" data-note="G4" data-key="20"></div>
                    <div class="key black" data-note="G#4" data-key="21"></div>
                    <div class="key white" data-note="A4" data-key="22"></div>
                    <div class="key black" data-note="A#4" data-key="23"></div>
                    <div class="key white" data-note="B4" data-key="24"></div>

                    <!-- Octave 5 -->
                    <div class="key white" data-note="C5" data-key="25"></div>
                    <div class="key black" data-note="C#5" data-key="26"></div>
                    <div class="key white" data-note="D5" data-key="27"></div>
                    <div class="key black" data-note="D#5" data-key="28"></div>
                    <div class="key white" data-note="E5" data-key="29"></div>
                    <div class="key white" data-note="F5" data-key="30"></div>
                    <div class="key black" data-note="F#5" data-key="31"></div>
                    <div class="key white" data-note="G5" data-key="32"></div>
                    <div class="key black" data-note="G#5" data-key="33"></div>
                    <div class="key white" data-note="A5" data-key="34"></div>
                    <div class="key black" data-note="A#5" data-key="35"></div>
                    <div class="key white" data-note="B5" data-key="36"></div>

                    <!-- Final top key -->
                    <div class="key white" data-note="C6" data-key="37"></div>
                </div>
            </div>
        </div>

        <!-- Canvas Row -->
        <div class="row justify-content-center mt-3">
            <div class="col-12 col-md-10">
                <canvas id="piano" class="w-100"></canvas>
            </div>
        </div>
    </div>


    <script src="assets/js/main.js"></script>
</body>

</html>
